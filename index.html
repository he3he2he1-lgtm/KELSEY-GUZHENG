<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eadfc9" />
    <meta name="description" content="Three original guzheng tracks by Kelsey Zhao." />
    <meta property="og:title" content="KELSEY — 3 TRACKS" />
    <meta property="og:description" content="Three original guzheng tracks by Kelsey Zhao." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://he3he2he1-lgtm.github.io/KELSEY-GUZHENG/og.png" />
    <title>KELSEY — 3 TRACKS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>

      <header class="masthead">
        <span class="brand-instrument">古筝 Guzheng</span>
        <h1>赵可欣 Kelsey Zhao</h1>
      </header>

      <section class="record-grid" aria-label="Choose a track">
        <article class="track-card is-active" data-track="0">
          <button class="record-button" type="button" aria-label="Play track 1, 🥺🌧️" aria-pressed="true">
            <span class="record-stage">
              <span class="record record-violet" aria-hidden="true">
                <span class="record-grooves"></span>
                <span class="record-shine"></span>
                <span class="record-label"><span>🥺🌧️</span></span>
              </span>
            </span>
          </button>
          <div class="track-meta"><span class="track-number">01</span><span class="track-duration">03:38</span></div>
        </article>

        <article class="track-card" data-track="1">
          <button class="record-button" type="button" aria-label="Play track 2, 💃" aria-pressed="false">
            <span class="record-stage">
              <span class="record record-coral" aria-hidden="true">
                <span class="record-grooves"></span>
                <span class="record-shine"></span>
                <span class="record-label"><span>💃</span></span>
              </span>
            </span>
          </button>
          <div class="track-meta"><span class="track-number">02</span><span class="track-duration">07:26</span></div>
        </article>

        <article class="track-card" data-track="2">
          <button class="record-button" type="button" aria-label="Play track 3, 😎" aria-pressed="false">
            <span class="record-stage">
              <span class="record record-cyan" aria-hidden="true">
                <span class="record-grooves"></span>
                <span class="record-shine"></span>
                <span class="record-label"><span>😎</span></span>
              </span>
            </span>
          </button>
          <div class="track-meta"><span class="track-number">03</span><span class="track-duration">03:31</span></div>
        </article>
      </section>

      <section class="lower-panel" aria-label="Player controls and mobile link">
        <section class="player-dock" aria-label="Audio player">
          <audio id="audio" src="audio/track-01.mp3" preload="metadata"></audio>
          <div class="control-row timeline">
            <div class="time-display"><span id="current-time">00:00</span><span id="total-time">03:38</span></div>
            <input id="progress" aria-label="Track position" type="range" min="0" max="0" step="0.1" value="0" />
          </div>
        </section>

        <label class="volume-card" aria-label="Volume control">
          <span class="speaker-icon" aria-hidden="true">🔊</span>
          <span class="vertical-slider-wrap">
            <input id="volume" class="vertical-volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.8" />
          </span>
        </label>

        <section class="share-card" aria-label="QR code for this music player">
          <div class="qr-frame" id="qr-code" aria-hidden="true"></div>
        </section>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
